name: Deploy production

# Builds the static site (out/, from the JSON files in data/) and publishes it to the `production-latest` release.
# The host pulls it from there by cron and serves the files as they are; GitHub holds no host credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci
      - run: npm run test:int
      - run: npm run build # also validates data/

      - name: Smoke test
        working-directory: out
        run: |
          python3 -m http.server 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          PID=$!
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 15 --retry-connrefused --retry-delay 1 --max-time 30 http://127.0.0.1:3000/pl/miasta/ || true)
          kill $PID
          echo "/pl/miasta/ -> $code"
          [ "$code" = 200 ] || { cat "$RUNNER_TEMP/server.log"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "bundle-$GITHUB_SHA.tar.gz" -C out .
          echo "$GITHUB_SHA" > version.txt
          gh release view production-latest >/dev/null 2>&1 ||
            gh release create production-latest --latest=false --title "production (latest build)" --notes "Pulled by the production server."
          # bundle first, version last: the host never sees a version without its bundle
          gh release upload production-latest "bundle-$GITHUB_SHA.tar.gz" --clobber
          gh release upload production-latest version.txt --clobber
          gh release view production-latest --json assets --jq '.assets | map(select(.name | startswith("bundle-"))) | sort_by(.createdAt) | reverse | .[3:] | .[].name' |
            xargs -r -n1 gh release delete-asset production-latest --yes
