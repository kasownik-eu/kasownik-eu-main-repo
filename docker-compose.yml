services:
  # Dev server; content comes from ./data, no database needed
  web:
    image: node:22.23.4-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm ci && npm run dev"
    env_file:
      - .env

volumes:
  node_modules:
